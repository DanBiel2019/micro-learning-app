name: Daily episode

# Writes, voices and publishes one micro-learning episode per day as a GitHub Release.
# The app reads releases/latest/download/feed.json.
#
# Needs one repository secret: ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "30 9 * * *"   # 09:30 UTC = 5:30 AM US Eastern (daylight time)
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD). Defaults to today (UTC)."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r pipeline/requirements.txt

      - name: Cache Kokoro voice model
        id: kokoro
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0

      - name: Download Kokoro voice model
        if: steps.kokoro.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kokoro && cd ~/kokoro
          curl -sSL -O https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -O https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Write and voice today's episode
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KOKORO_DIR: ~/kokoro
        run: |
          export KOKORO_DIR="$HOME/kokoro"
          python daily.py --repo "${{ github.repository }}" ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Publish release
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/feed.json ]; then
            python publish.py --repo "${{ github.repository }}"
          else
            echo "No new episode to publish."
          fi

      - name: Keep the script as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_id }}
          path: pipeline/out/episode.json
          if-no-files-found: ignore
