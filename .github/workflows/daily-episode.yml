name: Daily episode

# Writes, voices and publishes one micro-learning episode per day as a GitHub Release.
# Publishes a dated ep-YYYY-MM-DD release and refreshes the rolling daily-feed release;
# the app reads releases/download/daily-feed/feed.json.
#
# Everything runs on the GitHub runner with open-weights models, so no API keys are needed:
#   - Gemma 4 26B-A4B (Apache-2.0, mixture of experts, ~4B active) via llama.cpp writes the scripts,
#     grounded in Wikipedia and news articles
#   - Kokoro (Apache-2.0) voices the two hosts
# Optional: set engine=claude on a manual run (needs an ANTHROPIC_API_KEY secret).

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 4:00 AM US Eastern (daylight time); about an hour of CPU time, ready by breakfast
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date (YYYY-MM-DD). Defaults to today (UTC)."
        required: false
      engine:
        description: "Script writer"
        type: choice
        options: [local, claude]
        default: local
      publish:
        description: "Publish to the app (untick for a dry run; outputs are kept as an artifact)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

env:
  LLAMA_CPP_BUILD: b11335
  # 13.6 GB: fits the runner's 16 GB RAM with room for a 12k context (most layers use a
  # 1k sliding window, so the KV cache stays under 1 GB). Fallback if memory ever gets
  # tight: gemma-4-26B-A4B-it-UD-Q3_K_XL.gguf (12.9 GB) from the same repo, or the dense
  # google/gemma-4-12B-it-qat-q4_0-gguf (7 GB, slower but tiny).
  LLM_FILE: gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
  LLM_URL: https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The model is downloaded fresh each run (larger than the 10 GB Actions cache limit),
        # so make room by deleting toolchains this job never uses (~30 GB).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r pipeline/requirements.txt

      - name: Restore cached voice model and llama.cpp
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/kokoro
            ~/llama
          key: tools-kokoro-v1.0-llama-${{ env.LLAMA_CPP_BUILD }}

      - name: Download voice model and llama.cpp
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kokoro ~/llama
          curl -fsSL -o ~/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o ~/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          curl -fsSL https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_CPP_BUILD/llama-$LLAMA_CPP_BUILD-bin-ubuntu-x64.tar.gz \
            | tar xz -C ~/llama --strip-components=1
          ls -la ~/llama/llama-server

      - name: Save voice model and llama.cpp to cache
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/kokoro
            ~/llama
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Download the writing model
        # Hugging Face serves this from a CDN in a few minutes; too big for the Actions cache.
        run: |
          mkdir -p ~/models
          start=$(date +%s)
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors -C - -o ~/models/$LLM_FILE "$LLM_URL"
          echo "Downloaded $(du -h ~/models/$LLM_FILE | cut -f1) in $(( $(date +%s) - start ))s"
          free -m; nproc; grep -m1 'model name' /proc/cpuinfo

      - name: Write and voice today's episode
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENGINE: ${{ inputs.engine || 'local' }}
          EPISODE_DATE: ${{ inputs.date }}
        run: |
          export KOKORO_DIR="$HOME/kokoro"
          export LLM_MODEL="$HOME/models/$LLM_FILE"
          export LLAMA_SERVER="$HOME/llama/llama-server"
          export LD_LIBRARY_PATH="$HOME/llama:${LD_LIBRARY_PATH:-}"
          export LLM_LOG="$RUNNER_TEMP/llama-server.log"
          python -u daily.py --repo "${{ github.repository }}" --engine "$ENGINE" ${EPISODE_DATE:+--date "$EPISODE_DATE"}

      - name: Publish release
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Scheduled runs have no inputs, and null == false is true in Actions expressions.
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.publish == false }}" = "true" ]; then
            echo "Dry run: not publishing."
          elif [ -f out/feed.json ]; then
            python publish.py --repo "${{ github.repository }}"
          else
            echo "No new episode to publish."
          fi

      - name: Keep the episode and model log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_id }}
          path: |
            pipeline/out/
            ${{ runner.temp }}/llama-server.log
          if-no-files-found: ignore
